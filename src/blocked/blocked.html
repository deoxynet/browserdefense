<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigation Blocked - BrowserDefense</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="48" height="48" rx="10" fill="#1e40af"/>
        <path d="M24 10L34 16V26C34 32.075 29.627 37.593 24 39C18.373 37.593 14 32.075 14 26V16L24 10Z" stroke="white" stroke-width="2.5" fill="none"/>
        <path d="M20 24L23 27L28 21" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="logo-text">BrowserDefense</span>
    </div>

    <h1 role="alert" aria-live="assertive">Navigation Blocked</h1>
    <p class="subtitle" id="block-description">The URL you attempted to visit has been blocked by your organization's security policy.</p>

    <div class="details" id="block-details" role="region" aria-label="Block details">
      <div class="detail-row">
        <span class="detail-label" id="url-label">Blocked URL</span>
        <span class="detail-value" id="blocked-url" aria-labelledby="url-label">-</span>
      </div>
      <div class="detail-row">
        <span class="detail-label" id="time-label">Time</span>
        <span class="detail-value" id="timestamp" aria-labelledby="time-label">-</span>
      </div>
      <div class="detail-row" id="category-row">
        <span class="detail-label" id="category-label">Category</span>
        <span class="detail-value" id="category" aria-labelledby="category-label">-</span>
      </div>
    </div>

    <p class="help-text">
      If you believe this is an error, contact your security team.
    </p>

    <div class="actions" role="group" aria-label="Actions">
      <button class="btn-primary" id="go-back" aria-label="Go back to previous page">Go Back</button>
      <a class="btn-secondary" id="report-fp" href="#" aria-label="Report this block as a false positive">Report False Positive</a>
    </div>

    <footer class="footer">
      Protected by BrowserDefense
    </footer>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
