# BrowserDefense Shadow Telemetry Cloudflare Worker Configuration
# Server-side global first-seen tracking for DOM kit hashes
# Reference: Issue #203
#
# See: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "browserdefense-shadow-telemetry"
main = "functions/shadow-telemetry.ts"
compatibility_date = "2024-01-01"

# Node.js compatibility for crypto APIs
compatibility_flags = ["nodejs_compat"]

# KV namespace for hash tracking data
[[kv_namespaces]]
binding = "HASH_TRACKING_KV"
id = "YOUR_HASH_TRACKING_KV_ID"  # Set via: wrangler kv namespace create HASH_TRACKING_KV

# KV namespace for rate limiting
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "YOUR_RATE_LIMIT_KV_ID"  # Set via: wrangler kv namespace create RATE_LIMIT_KV

[vars]
# Public configuration
CORS_ORIGIN = "*"

# Development overrides
[env.development]
name = "browserdefense-shadow-telemetry-dev"

[[env.development.kv_namespaces]]
binding = "HASH_TRACKING_KV"
id = "YOUR_DEV_HASH_TRACKING_KV_ID"

[[env.development.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "YOUR_DEV_RATE_LIMIT_KV_ID"

[env.development.vars]
CORS_ORIGIN = "http://localhost:3000"

# Staging environment
[env.staging]
name = "browserdefense-shadow-telemetry-staging"

[[env.staging.kv_namespaces]]
binding = "HASH_TRACKING_KV"
id = "YOUR_STAGING_HASH_TRACKING_KV_ID"

[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "YOUR_STAGING_RATE_LIMIT_KV_ID"

# Production environment
[env.production]
name = "browserdefense-shadow-telemetry"

[[env.production.kv_namespaces]]
binding = "HASH_TRACKING_KV"
id = "YOUR_PROD_HASH_TRACKING_KV_ID"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "YOUR_PROD_RATE_LIMIT_KV_ID"
