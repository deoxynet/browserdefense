name = "browserdefense-api"
main = "functions/api.ts"
compatibility_date = "2024-01-01"

# Environment variables (secrets should be set via wrangler secret put)
# STRIPE_SECRET_KEY - set via: wrangler secret put STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET - set via: wrangler secret put STRIPE_WEBHOOK_SECRET

[vars]
ENVIRONMENT = "production"

# Routes (when deployed)
# - /webhook/stripe -> Stripe webhook handler
# - /checkout/create-session -> Create checkout session
# - /api/create-checkout-session -> Alias for create session (website compatibility)

# Development environment
# R2 bucket for forensics storage
[[r2_buckets]]
binding = "FORENSICS_BUCKET"
bucket_name = "browserdefense-forensics"

# KV namespace for rate limiting
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "YOUR_KV_NAMESPACE_ID"  # Set via: wrangler kv namespace create RATE_LIMIT_KV

[env.dev]
name = "browserdefense-api-dev"
vars = { ENVIRONMENT = "development" }

[[env.dev.r2_buckets]]
binding = "FORENSICS_BUCKET"
bucket_name = "browserdefense-forensics-dev"

[[env.dev.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "YOUR_DEV_KV_NAMESPACE_ID"  # Set via: wrangler kv namespace create RATE_LIMIT_KV --env dev
